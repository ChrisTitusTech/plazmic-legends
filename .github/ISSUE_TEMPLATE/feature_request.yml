name: Feature request
description: Propose a focused improvement within the read-only product boundary
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Plazmic Legends is feature complete. New work must remain external,
        local, read-only, and narrowly aligned with the existing companion.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not addressed by the current release?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or smaller alternatives.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This remains external and read-only.
          required: true
        - label: This does not add automation, injection, scripting, or remote control.
          required: true
        - label: This does not require redistributing game content or private data.
          required: true
