name: Feature request
description: Propose a focused improvement or a major new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Plazmic Legends has an extensible native Linux foundation. New trust
        boundaries require an explicit capability phase with provenance,
        consent, privacy, security, lifecycle, validation, and rollback gates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not addressed by the current release?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or smaller alternatives.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I identified new inputs, outputs, side effects, privileges, and retained data.
          required: true
        - label: This proposal does not bypass authentication, integrity, anti-cheat, or client protections.
          required: true
        - label: This does not require unconsented or bundled redistribution of game content or private data.
          required: true
